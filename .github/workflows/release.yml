name: Controlled release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: 'Create a draft only after reviewed release evidence and environment approval'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Require reviewed evidence for this exact source and version
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_release_gate.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:RELEASE_REF_TYPE -ne 'tag' -or $env:RELEASE_TAG -ne "v$version") { throw 'A matching reviewed version tag is required.' }
      - name: Test and build unsigned GUI and CLI candidates
        shell: pwsh
        run: ./scripts/build_exe.ps1
      - name: Validate executable self-test and help
        shell: pwsh
        run: |
          & ./dist/WinNetDiff-CLI.exe --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./dist/WinNetDiff-CLI.exe --lang en --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package complete Windows and source assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item -LiteralPath @('dist/WinNetDiff.exe','dist/WinNetDiff-CLI.exe','windows_net_diffdiag.py') -Destination release
          Compress-Archive -Path dist/* -DestinationPath release/WinNetDiff-Windows.zip
          python scripts/build_source_zip.py --output release/WinNetDiff-source.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/checksums.py release --write
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/checksums.py release --verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reviewed-windows-candidate
          path: release/*
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: validate-build
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: reviewed-windows-candidate
          path: release
      - name: Build provenance is not code signing or a security guarantee
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4; verified 2026-10-25
        with:
          subject-path: 'release/*'
          create-storage-record: false

  draft-release:
    needs: [validate-build, attest]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.create_draft == true &&
      needs.validate-build.result == 'success' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: reviewed-windows-candidate
          path: release
      - name: Maintainer-requested draft; never publish automatically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease --title "WinNetDiff $RELEASE_TAG (preview)" --notes-file docs/release-notes.md
