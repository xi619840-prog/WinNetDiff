name: Bug report
description: Report an incorrect diagnosis, crash, or UI problem.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Do not attach raw private reports, WFP XML, repair backups, credentials, tokens, or personal paths. Inspect redacted reports before sharing.'
  - type: input
    id: version
    attributes:
      label: WinNetDiff version and launch method
      placeholder: '2.2.0a3, Python source / GUI EXE / CLI EXE'
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build (no device identifiers)
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, observed diagnostic stage, and expected result
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - English
        - 简体中文
        - 繁體中文
  - type: input
    id: display
    attributes:
      label: For GUI problems, display scale and window size
      description: 'For example: 150%, normal window. Do not include device identifiers or private desktop screenshots.'
  - type: textarea
    id: context
    attributes:
      label: Recent changes and VPN context
      description: 'For example: software install/uninstall, Windows update, network switch. Avoid account or private network details.'
  - type: textarea
    id: evidence
    attributes:
      label: Manually reviewed, redacted evidence
      description: Prefer the reviewed compact share card. Include stage timings and error codes only; do not paste full driver inventories, SSIDs, WFP XML, credentials, or raw reports.
